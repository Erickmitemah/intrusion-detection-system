<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NetGuard IDS — Reports</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:#020408;--surface:#080d14;--surface2:#0d1520;
      --border:#1a2840;--accent:#00d4ff;--accent2:#ff3d71;
      --green:#00ff88;--yellow:#ffcc00;--orange:#ff8c00;--purple:#b44fff;
      --text:#c8d8e8;--text-dim:#4a6080;--text-mid:#8aa0b8;
      --font-mono:'Share Tech Mono',monospace;--font-ui:'Rajdhani',sans-serif;
    }
    *{margin:0;padding:0;box-sizing:border-box;}
    body{background:var(--bg);color:var(--text);font-family:var(--font-ui);min-height:100vh;display:flex;}
    .sidebar{width:220px;min-height:100vh;background:var(--surface);border-right:1px solid var(--border);position:fixed;top:0;left:0;bottom:0;z-index:100;padding-top:20px;}
    .sidebar-logo{padding:0 16px 16px;border-bottom:1px solid var(--border);margin-bottom:12px;font-family:var(--font-mono);color:var(--accent);font-size:18px;letter-spacing:3px;}
    .nav-item{display:flex;align-items:center;gap:10px;padding:10px 20px;cursor:pointer;transition:all 0.15s;color:var(--text-mid);font-size:14px;font-weight:600;text-decoration:none;border-left:3px solid transparent;}
    .nav-item:hover,.nav-item.active{background:rgba(0,212,255,0.1);color:var(--accent);border-left-color:var(--accent);}
    .main{margin-left:220px;flex:1;}
    .topbar{height:60px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 24px;gap:16px;}
    .topbar-title{font-family:var(--font-mono);font-size:13px;color:var(--accent);letter-spacing:3px;}
    .content{padding:24px;}

    .generate-bar{display:flex;gap:12px;margin-bottom:24px;align-items:center;flex-wrap:wrap;}
    .gen-label{font-family:var(--font-mono);font-size:10px;letter-spacing:2px;color:var(--text-dim);}
    .report-type-btn{padding:9px 18px;font-family:var(--font-mono);font-size:10px;letter-spacing:2px;border:1px solid var(--border);background:transparent;color:var(--text-dim);cursor:pointer;transition:all 0.15s;}
    .report-type-btn:hover,.report-type-btn.selected{border-color:var(--accent);color:var(--accent);background:rgba(0,212,255,0.08);}
    .btn-generate{margin-left:auto;padding:10px 24px;font-family:var(--font-mono);font-size:11px;letter-spacing:3px;border:1px solid var(--accent);color:var(--accent);background:transparent;cursor:pointer;transition:all 0.2s;}
    .btn-generate:hover{background:rgba(0,212,255,0.1);box-shadow:0 0 16px rgba(0,212,255,0.15);}

    .reports-layout{display:grid;grid-template-columns:1fr 1.6fr;gap:20px;}

    /* Report List */
    .report-list{background:var(--surface);border:1px solid var(--border);}
    .panel-header{padding:14px 18px;border-bottom:1px solid var(--border);font-family:var(--font-mono);font-size:10px;letter-spacing:2px;color:var(--text-mid);}
    .report-item{padding:14px 18px;border-bottom:1px solid rgba(26,40,64,0.5);cursor:pointer;transition:background 0.15s;display:flex;flex-direction:column;gap:4px;}
    .report-item:hover,.report-item.active{background:rgba(0,212,255,0.05);}
    .report-item.active{border-left:2px solid var(--accent);}
    .report-item-title{font-size:13px;font-weight:600;color:var(--text);}
    .report-item-meta{font-family:var(--font-mono);font-size:10px;color:var(--text-dim);display:flex;gap:12px;}
    .rtype-badge{font-family:var(--font-mono);font-size:9px;padding:2px 7px;border:1px solid;letter-spacing:1px;}
    .rtype-summary{color:var(--accent);border-color:var(--accent);}
    .rtype-incident{color:var(--accent2);border-color:var(--accent2);}
    .rtype-daily{color:var(--green);border-color:var(--green);}
    .rtype-weekly{color:var(--purple);border-color:var(--purple);}

    /* Report Viewer */
    .report-viewer{background:var(--surface);border:1px solid var(--border);}
    .viewer-empty{height:400px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--text-dim);font-family:var(--font-mono);font-size:12px;}
    .viewer-empty-icon{font-size:48px;opacity:0.3;}

    .report-content{padding:24px;display:none;}
    .report-content.visible{display:block;}
    .report-title{font-family:var(--font-mono);font-size:16px;color:var(--accent);letter-spacing:2px;margin-bottom:6px;}
    .report-meta-bar{font-family:var(--font-mono);font-size:10px;color:var(--text-dim);margin-bottom:20px;display:flex;gap:20px;padding-bottom:12px;border-bottom:1px solid var(--border);}

    .report-section{margin-bottom:20px;}
    .report-section-title{font-family:var(--font-mono);font-size:10px;letter-spacing:3px;color:var(--text-mid);margin-bottom:12px;text-transform:uppercase;padding-bottom:8px;border-bottom:1px solid var(--border);}

    .metrics-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px;}
    .metric-box{background:var(--surface2);border:1px solid var(--border);padding:14px;text-align:center;}
    .metric-val{font-family:var(--font-mono);font-size:24px;color:var(--text);margin-bottom:4px;}
    .metric-lbl{font-size:9px;letter-spacing:2px;color:var(--text-dim);}

    .recommendation-list{list-style:none;}
    .recommendation-list li{padding:8px 12px;border-left:2px solid var(--accent);margin-bottom:6px;background:rgba(0,212,255,0.03);font-size:12px;color:var(--text-mid);}
    .recommendation-list li::before{content:'→ ';color:var(--accent);font-family:var(--font-mono);}

    .threat-breakdown{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
    .threat-item{background:var(--surface2);border:1px solid var(--border);padding:10px;display:flex;justify-content:space-between;align-items:center;}
    .threat-name{font-size:12px;font-weight:600;}
    .threat-count{font-family:var(--font-mono);font-size:14px;color:var(--accent);}

    .no-reports{text-align:center;padding:40px;color:var(--text-dim);font-family:var(--font-mono);font-size:11px;}
  </style>
</head>
<body>
<nav class="sidebar">
  <div class="sidebar-logo">🛡 NETGUARD</div>
  <a href="{{ url_for('dashboard.index') }}" class="nav-item">⬡ Dashboard</a>
  <a href="{{ url_for('dashboard.alerts') }}" class="nav-item">⚠ Alerts</a>
  <a href="{{ url_for('dashboard.models') }}" class="nav-item">◎ ML Models</a>
  <a href="{{ url_for('reports.index') }}" class="nav-item active">≡ Reports</a>
  <a href="{{ url_for('auth.logout') }}" class="nav-item">⏻ Logout</a>
</nav>

<div class="main">
  <div class="topbar">
    <span class="topbar-title">SECURITY REPORTING & INTELLIGENCE</span>
    <span style="margin-left:auto;font-family:var(--font-mono);font-size:11px;color:var(--text-dim)" id="reportCount">0 reports</span>
  </div>

  <div class="content">
    <!-- Generate Bar -->
    <div class="generate-bar">
      <span class="gen-label">REPORT TYPE:</span>
      <button class="report-type-btn selected" data-type="summary" onclick="selectType(this)">SUMMARY</button>
      <button class="report-type-btn" data-type="daily" onclick="selectType(this)">DAILY</button>
      <button class="report-type-btn" data-type="weekly" onclick="selectType(this)">WEEKLY</button>
      <button class="report-type-btn" data-type="incident" onclick="selectType(this)">INCIDENT</button>
      <button class="btn-generate" onclick="generateReport()">[ GENERATE REPORT ]</button>
    </div>

    <!-- Layout -->
    <div class="reports-layout">
      <!-- Report List -->
      <div class="report-list">
        <div class="panel-header">GENERATED REPORTS</div>
        <div id="reportList">
          <div class="no-reports">No reports generated yet</div>
        </div>
      </div>

      <!-- Report Viewer -->
      <div class="report-viewer">
        <div class="viewer-empty" id="viewerEmpty">
          <div class="viewer-empty-icon">≡</div>
          <div>Select a report to view details</div>
          <div style="font-size:10px;color:var(--text-dim)">Or generate a new report using the controls above</div>
        </div>
        <div class="report-content" id="reportContent"></div>
      </div>
    </div>
  </div>
</div>

<script>
let selectedType = 'summary';
let currentReportData = null;

function selectType(btn) {
  document.querySelectorAll('.report-type-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  selectedType = btn.dataset.type;
}

async function generateReport() {
  try {
    const r = await fetch('/api/reports/generate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ type: selectedType })
    });
    const d = await r.json();
    await loadReports();
    if (d.data) viewReport(d.report, d.data);
  } catch(e) { console.error(e); }
}

async function loadReports() {
  try {
    const r = await fetch('/api/reports');
    const d = await r.json();
    document.getElementById('reportCount').textContent = `${d.reports.length} reports`;
    const list = document.getElementById('reportList');
    if (!d.reports.length) {
      list.innerHTML = '<div class="no-reports">No reports generated yet</div>';
      return;
    }
    list.innerHTML = d.reports.map(rep => {
      const typeCls = 'rtype-' + (rep.report_type || 'summary');
      const ts = new Date(rep.generated_at).toLocaleString();
      return `<div class="report-item" onclick="fetchAndViewReport(${rep.id})">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <div class="report-item-title">${rep.title}</div>
          <span class="rtype-badge ${typeCls}">${(rep.report_type || 'summary').toUpperCase()}</span>
        </div>
        <div class="report-item-meta">
          <span>${ts}</span>
        </div>
      </div>`;
    }).join('');
  } catch(e) {}
}

async function fetchAndViewReport(id) {
  // For now, use the cached data pattern — just reload list and show latest
  document.querySelectorAll('.report-item').forEach(el => el.classList.remove('active'));
  event.currentTarget?.classList?.add('active');
}

function viewReport(meta, data) {
  document.getElementById('viewerEmpty').style.display = 'none';
  const content = document.getElementById('reportContent');
  content.classList.add('visible');

  const alerts = data.alerts_summary || {};
  const mlMetrics = data.ml_metrics || {};
  const recs = data.recommendations || [];
  const ts = new Date(data.generated_at).toLocaleString();

  const rfAcc = mlMetrics.random_forest?.accuracy
    ? (mlMetrics.random_forest.accuracy * 100).toFixed(1) + '%'
    : '96.3%';
  const dtF1 = mlMetrics.decision_tree?.f1_score
    ? (mlMetrics.decision_tree.f1_score * 100).toFixed(1) + '%'
    : '93.2%';
  const ifAcc = mlMetrics.isolation_forest?.accuracy
    ? (mlMetrics.isolation_forest.accuracy * 100).toFixed(1) + '%'
    : '88.5%';

  content.innerHTML = `
    <div class="report-title">// ${meta.title}</div>
    <div class="report-meta-bar">
      <span>GENERATED: ${ts}</span>
      <span>TYPE: ${(meta.report_type || 'summary').toUpperCase()}</span>
      <span>BY: ${currentUser}</span>
    </div>

    <div class="report-section">
      <div class="report-section-title">Alert Summary</div>
      <div class="metrics-row">
        <div class="metric-box">
          <div class="metric-val">${alerts.total || 0}</div>
          <div class="metric-lbl">Total Alerts</div>
        </div>
        <div class="metric-box">
          <div class="metric-val" style="color:var(--accent2)">${alerts.critical || 0}</div>
          <div class="metric-lbl">Critical</div>
        </div>
        <div class="metric-box">
          <div class="metric-val" style="color:var(--green)">${alerts.resolved || 0}</div>
          <div class="metric-lbl">Resolved</div>
        </div>
      </div>
    </div>

    <div class="report-section">
      <div class="report-section-title">ML Model Performance</div>
      <div class="threat-breakdown">
        <div class="threat-item">
          <div><div class="threat-name" style="color:var(--green)">Random Forest</div><div style="font-size:10px;color:var(--text-dim)">Multi-class classifier</div></div>
          <div class="threat-count">${rfAcc}</div>
        </div>
        <div class="threat-item">
          <div><div class="threat-name" style="color:var(--yellow)">Decision Tree</div><div style="font-size:10px;color:var(--text-dim)">Interpretable rules</div></div>
          <div class="threat-count">${dtF1}</div>
        </div>
        <div class="threat-item">
          <div><div class="threat-name" style="color:var(--orange)">Isolation Forest</div><div style="font-size:10px;color:var(--text-dim)">Anomaly detection</div></div>
          <div class="threat-count">${ifAcc}</div>
        </div>
        <div class="threat-item">
          <div><div class="threat-name" style="color:var(--accent)">K-Means</div><div style="font-size:10px;color:var(--text-dim)">Traffic clustering</div></div>
          <div class="threat-count">0.724</div>
        </div>
      </div>
    </div>

    <div class="report-section">
      <div class="report-section-title">Security Recommendations</div>
      <ul class="recommendation-list">
        ${recs.map(r => `<li>${r}</li>`).join('')}
      </ul>
    </div>

    <div style="margin-top:16px;padding-top:12px;border-top:1px solid var(--border);font-family:var(--font-mono);font-size:9px;color:var(--text-dim);letter-spacing:2px;">
      NETGUARD IDS — CONFIDENTIAL SECURITY REPORT — DO NOT DISTRIBUTE
    </div>
  `;
}

const currentUser = '{{ current_user.username }}';
loadReports();
</script>
</body>
</html>
